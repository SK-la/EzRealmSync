# Dependabot：每日检查 NuGet；两组 PR（互不混入）。
# ez2lazer（Framework + Game）/ other-nuget；CI 通过后自动合并到 master。
# Game.Resources 只用于压掉传递依赖，本工具不使用，忽略更新。
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "ez2lazer.Game.Resources"
    groups:
      ez2lazer:
        patterns:
          - "ez2lazer.Framework"
          - "ez2lazer.Game"
      other-nuget:
        patterns:
          - "*"
        exclude-patterns:
          - "ez2lazer.Framework"
          - "ez2lazer.Game"
          - "ez2lazer.Game.Resources"
