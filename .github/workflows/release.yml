name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号（xxxx.xxx.x，如 2026.815.0），仅 workflow_dispatch 时使用'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # 发布硬门禁：单元测试必须全部通过，否则不会进入 release job。
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EzRealmSync.sln

      - name: Build
        run: dotnet build EzRealmSync.sln -c Release --no-restore -p:UseLocalOsuLibs=false

      - name: Test (unit)
        run: >
          dotnet test EzRealmSync.sln -c Release --no-build
          -p:UseLocalOsuLibs=false
          --filter "FullyQualifiedName!~Integration"

  release:
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $manual = '${{ inputs.tag }}'.Trim()
            if ($manual) { $tag = $manual }
          }
          if ($tag -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Tag must be xxxx.xxx.x (e.g. 2026.815.0), got: $tag"
            exit 1
          }
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Release version: $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore EzRealmSync.sln

      - name: Publish win-x64
        run: >
          dotnet publish osu.EzRealmSync.Desktop/osu.EzRealmSync.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:UseLocalOsuLibs=false
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/publish

      - name: Smoke publish output
        shell: pwsh
        run: ./scripts/smoke-publish.ps1 artifacts/publish

      - name: Test (integration)
        run: >
          dotnet test EzRealmSync.sln -c Release
          -p:UseLocalOsuLibs=false
          --filter "FullyQualifiedName~Integration"

      - name: Package zip
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $publishDir = 'artifacts/publish'
          $zip = "artifacts/EzRealmSync-$version-win-x64.zip"
          $sizeMb = [math]::Round(((Get-ChildItem $publishDir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 2)
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zip -Force
          $zipMb = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Output "Publish folder: ${sizeMb} MB; zip: ${zipMb} MB ($zip)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: EzRealmSync ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/EzRealmSync-${{ steps.version.outputs.version }}-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
